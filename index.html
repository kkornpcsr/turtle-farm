<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taodek Farm</title>
<base target="_top">
<meta name="theme-color" content="#2F5D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taodek Farm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1EA; --paper:#FFFFFF; --brand:#2F5D3A; --brand2:#E3EDE0;
  --text:#1C1F1A; --muted:#69736A; --line:#E0E5DC;
  --red:#B42318; --redbg:#FDECEA; --amber:#8A5A00; --ambg:#FFF3D6; --green:#2E7D32; --grbg:#E6F4E7;
  --f:"Sarabun","Leelawadee UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.meta{font-size:13.5px;color:var(--muted)}
.red{color:var(--red)} .green{color:var(--green)} .amber{color:var(--amber)}

/* ---------- header ---------- */
.top{background:var(--brand);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:20px;font-weight:700;flex:1;min-width:0}
.top .sync{font-size:12.5px;opacity:.85;background:none;border:0;color:#fff;padding:0}
.top .gear{background:none;border:1.5px solid rgb(255 255 255 / .45);color:#fff;border-radius:8px;width:38px;height:38px;font-size:18px;line-height:1}
.demo{background:var(--ambg);color:var(--amber);font-size:13.5px;padding:7px 16px}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px calc(150px + env(safe-area-inset-bottom))}

/* ---------- building blocks ---------- */
.card{background:var(--paper);border-radius:12px;padding:12px 14px;margin:0 0 12px;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.card h3{margin:0 0 6px;font-size:15px}
.list{background:var(--paper);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.tap{cursor:pointer}
.row.tap:active{background:var(--brand2)}
.id{font-weight:700;font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.warn{border-color:#F2C46D}
.b{display:inline-block;font-size:12px;line-height:1.5;padding:0 7px;border-radius:999px;font-weight:600;vertical-align:1px;white-space:nowrap}
.b.red{background:var(--redbg);color:var(--red)} .b.amb{background:var(--ambg);color:var(--amber)} .b.gr{background:var(--grbg);color:var(--green)} .b.grey{background:#EEF0EC;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--brand);color:#fff;white-space:nowrap}
.btn.ghost{background:var(--brand2);color:var(--brand)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn:disabled{opacity:.55}
.lnk{background:none;border:0;padding:2px 0;color:var(--brand);font-size:13.5px;font-weight:600}
.seg{display:inline-flex;background:#EEF0EC;border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:5px 11px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--paper);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.fld{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px}
.fld.sm{padding:6px 10px;font-size:16px;margin-top:6px}
.fl{display:block;margin:0 0 12px}
.fl>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.hint{font-size:12.5px;color:var(--muted);margin-top:3px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}

/* ---------- weigh tab ---------- */
.datebar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.datebar input{width:auto;flex:1;max-width:220px}
.notToday{color:var(--red);font-weight:700;font-size:13.5px}
.alert .row{padding:8px 0;border-top:1px solid var(--line)}
.alert .row:first-of-type{border-top:0}
.win{width:104px;flex:none;text-align:right;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;font-variant-numeric:tabular-nums;background:var(--paper)}
.win.done{border-color:#9CCB9F;background:var(--grbg)}
.win.chg{border-color:var(--brand)}
.pv{font-size:13.5px;font-weight:600;min-height:0}
.wbox{display:flex;align-items:center;gap:5px;flex:none}
.wbox .u{font-size:14px;font-weight:600;color:var(--muted);width:20px}
.wchk{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:6px;color:var(--red);font-weight:600}
.wchk input{width:18px;height:18px;accent-color:var(--red)}
.card.watch{background:var(--redbg);font-size:14.5px}
.savebar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:25;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -4px 12px rgb(0 0 0 / .06)}
.savebar>div{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom)}
.tab{flex:1;border:0;background:none;padding:8px 0 9px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--brand);font-weight:700}

/* ---------- home ---------- */
.hdate{font-size:13.5px;color:var(--muted);margin:-4px 0 10px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.quick button{height:64px;border:0;border-radius:14px;background:var(--paper);box-shadow:0 1px 2px rgb(0 0 0 / .05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--text)}
.quick button.main{background:var(--brand);color:#fff}
.quick svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.quick button:not(.main) svg{stroke:var(--amber)}
.card .row{padding:9px 0}
.card .row:first-of-type{border-top:0}
.ch{margin:0 0 4px;display:flex;align-items:center;justify-content:space-between}
.ch h3{margin:0}
.okb{min-width:36px;height:36px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--brand);font-weight:700;flex:none;font-size:13.5px}
.okb:disabled{opacity:.35}
.lrow{margin-bottom:8px}
.zrow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.lrow .zrow{margin-bottom:4px}
.seg.cyc{display:flex;flex-wrap:nowrap}
.seg.cyc button{flex:1;padding:4px 2px;font-size:12.5px;white-space:nowrap}
.chip.add{border-style:dashed;color:var(--brand);font-weight:600}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.zrow .fld{flex:1;min-width:0}
.zrow .meta{flex:none;width:64px;text-align:right;font-size:12.5px;line-height:1.25}
.row .who{width:84px;flex:none}
.row .who .id{font-size:17px;line-height:1.2}
.goline{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:12px;padding:12px 14px;margin:0 0 12px;box-shadow:0 1px 2px rgb(0 0 0 / .05);cursor:pointer}

/* ---------- weight rows ---------- */
.wrow{background:var(--paper);border-radius:12px;padding:6px 10px;margin:0 0 6px;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.wrow.done{background:#F6F7F3}
.wrow.done .id,.wrow.done .win{color:var(--muted)}
.wmain{display:flex;align-items:center;gap:8px}
.wmain .who{width:96px;flex:none}
.wmain .id{font-size:17px;line-height:1.2}
.wmain .meta{font-size:12px;line-height:1.3}
.wmain .win{flex:1;min-width:0;width:auto;height:44px;padding:0 10px;font-size:20px;font-weight:600}
.ub{height:44px;min-width:44px;border:0;border-radius:10px;background:#EEF0EC;font-weight:600;font-size:15px;flex:none}
span.ub{display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;color:var(--muted)}
.seg.wmode{margin-left:auto;flex:none}
.flag{width:44px;height:44px;border:0;border-radius:10px;background:none;display:flex;align-items:center;justify-content:center;color:#A3A99F;flex:none}
.flag.on{background:var(--ambg);color:var(--amber)}
.flag svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wmore{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;display:flex;flex-direction:column;gap:8px}
.syms{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sym{height:40px;padding:0 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-weight:600}
.sym[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#fff}
/* ---------- forms: ปุ่มติ๊กแทน dropdown ---------- */
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:2px 0 4px}
.chip{min-height:38px}
.fld{border-radius:12px;padding:11px 12px}
.fld.big{font-size:26px;font-weight:600;height:58px;padding:0 14px;font-variant-numeric:tabular-nums}
.fl>span{font-weight:600;color:var(--text)}
.fl>span small{font-weight:400;color:var(--muted)}
.dq{display:flex;gap:8px;align-items:center}
.dq input{flex:1;min-width:0}
.seg.wide{display:flex;margin:0 0 10px}
.seg.wide button{flex:1;padding:7px 4px}
table.h td.lo{color:var(--red);font-weight:700}
table.h td.dim{color:#B5BAB2}

/* ---------- eggs / groups ---------- */
.stat.s3{grid-template-columns:repeat(3,1fr)}
.stat.sub{background:var(--bg);border-radius:10px;padding:8px 6px;margin-top:8px}
.stat.sub b{font-size:20px}
.card.dim{background:#F6F7F3;color:var(--muted)}
.card.dim h3{color:#4A4A44}
.card h3.tap{cursor:pointer}
.step{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.step>span{font-size:16px;font-weight:600}
.step .dq{gap:4px}
.step b{width:56px;text-align:center;font-size:26px}
.stb{width:48px;height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:24px;line-height:1}
.stb.main{background:var(--brand);border-color:var(--brand);color:#fff}
.stb.main.amb{background:var(--amber);border-color:var(--amber)}
.quick.g4{margin:10px 0 0}
.quick.g4 button{height:44px;font-size:13.5px;border:1.5px solid var(--line);box-shadow:none}
.quick.g4 button.main{border-color:var(--brand)}
.mline span{white-space:nowrap}
.mline{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:12px;padding:9px 12px;margin:0 0 10px;box-shadow:0 1px 2px rgb(0 0 0 / .05);font-size:13.5px}
.mline b{font-size:14.5px}
.stn{width:64px;height:48px;text-align:center;font-size:24px;font-weight:700;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text)}
.dpick{position:relative;flex:1;max-width:220px}
.dpick .dlabel{display:flex;align-items:center;height:42px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:15.5px;font-weight:600}
.dpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.calc{font-size:13px;color:var(--muted);margin:-6px 0 10px}
details.fold>summary{cursor:pointer;font-weight:700;font-size:15.5px;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:" ▸";color:var(--muted);font-weight:500}
details.fold[open]>summary::after{content:" ▾"}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgb(20 30 20 / .38);display:flex;align-items:flex-end}
.sheet{background:var(--paper);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.mh{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.mh h2{margin:0;font-size:20px;flex:1;min-width:0}
.mh h2 small{font-size:14px;color:var(--muted);font-weight:500}
.x{border:0;background:#EEF0EC;border-radius:8px;width:36px;height:36px;font-size:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .btn{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14.5px;margin:0 0 10px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chart{width:100%;height:auto;display:block;margin:4px 0 8px}
table.h{width:100%;border-collapse:collapse;font-size:14.5px}
table.h th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:right;padding:4px 6px;border-bottom:1.5px solid var(--line)}
table.h td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.h th:first-child,table.h td:first-child{text-align:left}
table.h tr.tap{cursor:pointer}
table.h tr.note td{padding-top:0;color:var(--muted);font-size:13px;text-align:left}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat b{display:block;font-size:clamp(12px,4vw,20px);overflow-wrap:anywhere}
.stat span{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom));z-index:60;background:#1F2A20;color:#fff;padding:9px 16px;border-radius:10px;font-size:14.5px;max-width:calc(100% - 32px)}
.pin{max-width:360px;margin:40px auto;padding:0 16px}
</style>
</head>
<body>
<div id="app"></div>
<div class="savebar" id="savebar" hidden></div>
<nav class="tabs" id="tabs" hidden>
  <button class="tab" data-act="tab" data-t="home"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/></svg>Home</button>
  <button class="tab" data-act="tab" data-t="weigh"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v18M6 21h12M4 7h16M6 7l-3 7a3 3 0 0 0 6 0L6 7zM18 7l-3 7a3 3 0 0 0 6 0l-3-7z"/></svg>Weight</button>
  <button class="tab" data-act="tab" data-t="turtles"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 14a8 6 0 0 1 16 0v3H4zM4 14h16M9 8.5L10 14M15 8.5L14 14M12 8v9M2 17h20"/></svg>Tortoise</button>
  <button class="tab" data-act="tab" data-t="money"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>Money</button>
</nav>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<script>
/* ================= ค่าคงที่ + ตัวช่วย ================= */
const GROUPS = ["ลูกเต่า", "ตัวกลาง", "พ่อแม่พันธุ์"];
const SEXES = ["ผู้", "เมีย", "ไม่ทราบ"];
const SOURCES = ["ฟักเอง", "ซื้อมา"];
const ALIVE = "มีชีวิต", RESERVED = "จองแล้ว", SOLD = "ขายแล้ว", DEAD = "ตาย";
// สายพันธุ์ = เฉพาะที่มีในฟาร์ม (ตรงกับ Code.gs) · พันธุ์อื่นกด ＋ New ในฟอร์ม
const DEF = { species: ["Sulcata", "Albino Sulcata", "Leopard", "Indian Star", "Burmese Star", "Aldabra"], zones: ["บ้าน", "ฟาร์ม"] };
// วันที่ในแอปเป็นอังกฤษ ปี พ.ศ. 2 หลัก เช่น 16 Nov 69 (Korn เลือก 2026-11-15)
const EN_M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
// ปุ่มอาการตอนชั่ง (Korn เลือก 2 ปุ่ม ที่เหลือพิมพ์เอง) · ติ๊กแล้ว = เข้า Watch บนหน้า Home อัตโนมัติ
const SYMPTOMS = ["น้ำมูก", "ไม่กิน"];
// น้ำหนักต่างจากรอบก่อนเกินนี้ = ถามให้เช็กตัวเลขก่อนบันทึก (กันพิมพ์ผิด เช่น กรัม/กิโล สลับกัน)
const TYPO_PCT = 30;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const x = parseFloat(String(v == null ? "" : v).replace(/,/g, "")); return isFinite(x) ? x : 0; };
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const cmpId = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
function thDate(s) {
  if (!s) return "";
  const d = parseISO(s), y = d.getFullYear();
  return d.getDate() + " " + EN_M[d.getMonth()] + (y !== new Date().getFullYear() ? " " + String(y + 543).slice(-2) : "");
}
const fullDate = s => s ? parseISO(s).getDate() + " " + EN_M[parseISO(s).getMonth()] + " " + String(parseISO(s).getFullYear() + 543).slice(-2) : "";
// งานทำซ้ำ: รอบถัดไปนับจากวันที่ทำเสร็จจริง (Korn 2026-11-22) เช่น ถ่ายพยาธิช้าไป 2 สัปดาห์ ปีหน้าก็เลื่อนตาม
const nextTaskDate = repeatDays => addDays(todayISO(), repeatDays);
const ago = n => n === 0 ? "วันนี้" : n + " วันก่อน";
function age(born) {
  if (!born) return "";
  const m = Math.floor(daysBetween(born, todayISO()) / 30.44);
  if (m < 0) return "";
  return m < 12 ? m + " เดือน" : Math.floor(m / 12) + " ปี" + (m % 12 ? " " + (m % 12) + " เดือน" : "");
}
// น้ำหนักเก็บเป็นกรัมเสมอ แสดงเป็น kg เมื่อถึง 1,000 g
function fmtG(g) {
  g = num(g);
  const a = Math.abs(g);
  return a >= 1000 ? (g / 1000).toLocaleString("en-US", { maximumFractionDigits: 2 }) + " kg" : (a >= 100 ? Math.round(g) : Math.round(g * 10) / 10) + " g";
}

    if (!h) throw new Error("ชุดนี้ยังไม่มีบันทึก + Hatched");
    const lot = lotById(h.lot);
    if (lot && lotAvail(lot) < num(h.n) + num(h.split)) throw new Error("กลุ่มเหลือไม่พอให้หักคืน");
    return out;
  }
  if (fn === "apiSaveMoney") return Object.assign(out, { id: "M" + String(S.money.length + 1).padStart(5, "0") });
  if (fn === "apiSaveMoneyBatch") return { rev: out.rev, items: a[0].filter(x => num(x.amount) > 0).map((x, i) => ({ id: "M" + String(S.money.length + i + 1).padStart(5, "0") })) };
  if (fn === "apiSaveTask") { const task = clone(a[0]); task.id = task.id || "T" + String(S.tasks.length + 1).padStart(5, "0"); return Object.assign(out, { id: task.id }); }
  if (fn === "apiRecordSale") {
    const item = a[0];
    if (item.turtleId && (!idx().byId[item.turtleId] || idx().byId[item.turtleId].status !== ALIVE)) throw new Error("เต่าตัวนี้ไม่ได้อยู่ในสถานะมีชีวิต");
    return Object.assign(out, { id: "M" + String(S.money.length + 1).padStart(5, "0") });
  }
  if (fn === "apiBuyTurtle") {
    if (idx().byId[a[1].id]) throw new Error("รหัสนี้มีอยู่แล้ว");
    return Object.assign(out, { id: "M" + String(S.money.length + 1).padStart(5, "0") });
  }
  if (fn === "apiCompleteTask") {
    const task = S.tasks.find(x => x.id === a[0]);
    if (!task) throw new Error("ไม่พบงานนี้");
    return out;
  }
  if (fn === "apiDeleteTask") return out;
  if (fn === "apiCompleteSale") { if (!S.money.some(x => x.id === a[0])) throw new Error("ไม่พบรายการจอง"); return out; }
  if (fn === "apiSaveTurtles" && a[1]) {
    const dup = a[0].map(t => t.id).filter(id => idx().byId[id]);
    if (dup.length) throw new Error("รหัสนี้มีอยู่แล้ว: " + dup.join(", "));
  }
  if (fn === "apiRenameTurtle") {
    if (!idx().byId[a[0]]) throw new Error("ไม่พบรหัสเต่า " + a[0]);
    if (a[0] !== a[1] && idx().byId[a[1]]) throw new Error("รหัสนี้มีอยู่แล้ว: " + a[1]);
  }
  if (fn === "apiSaveClutch") out.id = a[0].id || nextClutchId();
  return out;
}

// สถานะชุดไข่: ปิดแล้ว / กำลังออก (มีตัวออกแล้ว) / ยังไม่เช็กเชื้อ / ฟักอยู่ (เช็กเชื้อแล้ว)

/** % มีเชื้อ นับเฉพาะชุดที่เช็กแล้ว · % ฟักออก นับเฉพาะชุดที่ปิดแล้ว · % เบิ้ล จากตัวที่ออกทั้งหมด */

    fertPct: fe ? Math.round(sum(checked, "fertile") / fe * 100) : null, hatchPct: de ? Math.round(sum(done, "hatched") / de * 100) : null, splitPct: hatched ? Math.round(split / hatched * 100) : null,
    doneN: done.length };
}
const yy = y => String(Number(y) + 543).slice(-2);
const pct = v => v == null ? "–" : v + "%";

  const years = [...new Set(S.clutches.map(c => String(c.laid).slice(0, 4)).filter(Boolean).concat([String(new Date().getFullYear())]))].sort().reverse();

    // ออกแล้ว = นับทุกชุด · % ฟัก = เฉพาะชุดที่ปิดแล้ว (ชุดที่ยังออกอยู่ยังไม่จบ) แยกช่องกันไม่ให้อ่านปน
    + `<div class="card"><div class="stat s3"><div><b>${s.n}</b><span>Clutches · ${s.moms} แม่</span></div><div><b>${s.eggs}</b><span>Eggs</span></div><div><b>${pct(s.fertPct)}</b><span>Fertile %</span></div><div><b>${s.hatched}</b><span>Hatched</span></div><div><b>${pct(s.hatchPct)}</b><span>Hatch % · ${s.doneN} ชุดที่ปิด</span></div><div><b class="${s.split ? "amber" : ""}">${s.split}</b><span>เบิ้ล · ${pct(s.splitPct)}</span></div></div>
       <div class="bar" style="margin:8px 0 0"><span class="meta grow">Fertile % นับชุดที่เช็กแล้ว</span><button class="lnk" data-act="byMother">By mother ▸</button></div></div>`

function clutchCard(c) {

/* ---------- หน้าแรก / ล็อต / เงิน / Todo ---------- */
const baht = n => num(n).toLocaleString("th-TH", { maximumFractionDigits: 2 }) + " บาท";
function monthMoney(date) {
  const month = String(date || todayISO()).slice(0, 7);
  return S.money.filter(x => String(x.date).startsWith(month));
}
function previousMonthKey(date) {
  const d = parseISO(date);
  d.setDate(1); d.setMonth(d.getMonth() - 1);
  return iso(d).slice(0, 7);
}
function previousCategoryTotal(category) {
  const month = previousMonthKey(todayISO());
  return S.money.filter(x => x.direction === "จ่าย" && x.category === category && String(x.date).startsWith(month))
    .reduce((n, x) => n + num(x.amount), 0);
}
function turtleFinance(id) {
  const includes = x => String(x.turtleId || "").split(",").map(s => s.trim()).includes(id);
  const purchase = S.money.filter(x => x.direction === "จ่าย" && x.category === "ซื้อเต่า" && includes(x)).reduce((n, x) => n + num(x.amount), 0);
  const sale = S.money.filter(x => x.direction === "รับ" && x.category === "ขายเต่า" && x.saleStatus === "paid" && includes(x)).reduce((n, x) => n + num(x.total), 0);
  const expenses = S.money.filter(x => x.direction === "จ่าย" && x.category !== "ซื้อเต่า" && includes(x));
  const costs = expenses.reduce((n, x) => n + num(x.amount) / String(x.turtleId).split(",").filter(Boolean).length, 0);
  return { purchase, sale, costs, rows: expenses };
}
function incomingTotal(list) { return list.filter(x => x.direction === "รับ").reduce((n, x) => n + num(x.amount), 0); }
function outgoingTotal(list) { return list.filter(x => x.direction === "จ่าย").reduce((n, x) => n + num(x.amount), 0); }
function lotSold(id) {

    .reduce((n, x) => n + num(x.quantity), 0);
}
function lotReserved(id) {

    .reduce((n, x) => n + num(x.quantity), 0);

}
const lotSoldDefect = id => S.money.filter(x => x.lotId === id && x.direction === "รับ" && /^(paid|deposit)$/.test(x.saleStatus)).reduce((n, x) => n + num(x.defectQty), 0);

const repLabel = n => { if (!num(n)) return ""; const r = REPEATS.find(x => x[0] === num(n)); return r ? r[1] : num(n) === 7 ? "Weekly" : `Every ${num(n)} days`; };
/** กำหนดเสร็จของงาน: เลยมา / วันนี้ / อีก N วัน */

}

/** รายการ Watch บน Home: เตือนไข่ (อัตโนมัติ) + ตัวที่ Korn ติ๊กอาการ/กดเฝ้าดูเอง (กด Done เพื่อเอาออก) */

    // เงินเดือนนี้ขึ้นบนสุด (Korn เปิดแอปอยากเห็น Todo · แม่ใกล้ไข่ · กำไร/ขาดทุนเดือนนี้ ในจอเดียว)

async function saveMoneyForm() {
  const f = clone(S.form), ed = f.editId, old = ed ? S.money.find(x => x.id === ed) : null;
  const done = r => { if (r) { closeModal(); render(); } };
  if (!f.date) { alert("ใส่วันที่"); return; }
  if (f.kind === "sale") {
    const total = num(f.total);
    let quantity = 1, dq = 0;
    if (f.target === "lot") {
      const lot = lotById(f.lotId);
      if (!lot) { alert("เลือกกลุ่ม"); return; }
      const n = Math.round(num(f.n)); dq = Math.round(num(f.dq)); quantity = n + dq;
      const avail = lotAvail(lot) + (old ? num(old.quantity) : 0), def = lotDefectLeft(lot) + (old ? num(old.defectQty) : 0);
      if (n < 0 || dq < 0 || !(quantity > 0)) { alert("ใส่จำนวนที่ขาย"); return; }
      if (quantity > avail) { alert(`ขาย ${quantity} ตัว มากกว่าที่เหลือในกลุ่ม (${avail} ตัว)`); return; }
      if (dq > def) { alert(`เบิ้ลในกลุ่มมี ${def} ตัว`); return; }
    } else if (!f.turtleId) { alert("เลือกเต่า"); return; }
    if (!(total > 0)) { alert("ใส่ราคา"); return; }
    const item = { date: f.date, direction: "รับ", category: "ขายเต่า", amount: total, turtleId: f.target === "turtle" ? f.turtleId : "", lotId: f.target === "lot" ? f.lotId : "", quantity, total, saleStatus: "paid", docNo: f.docNo || "", note: f.note, defectQty: dq };
    if (ed) { item.id = ed; done(await save("apiUpdateMoney", [item], () => local.moneyUpd(item), "แก้แล้ว")); return; }
    done(await save("apiRecordSale", [item], res => {
      local.money(Object.assign({}, item, { id: res.id }));
      if (item.turtleId) local.turtles([Object.assign(clone(idx().byId[item.turtleId]), { status: SOLD, sDate: f.date, sNote: "ขายแล้ว", watch: "", wNote: "" })]);
    }, `บันทึกการขายแล้ว${f.target === "lot" ? ` · ${quantity} ตัว` : ""}`));
    return;
  }
  const amount = num(f.amount);
  if (!(amount > 0)) { alert("ใส่ยอดเงิน"); return; }
  if (f.kind === "buy" && ed) {
    const item = Object.assign(clone(old), { date: f.date, amount, total: amount, note: f.note });
    done(await save("apiUpdateMoney", [item], () => local.moneyUpd(item), "แก้แล้ว"));
    return;
  }
  if (f.kind === "buy") {
    const id = String(f.id || "").trim();
    if (!id || idx().byId[id]) { alert(id ? "รหัสนี้มีอยู่แล้ว" : "ใส่รหัสเต่า"); return; }
    const turtle = Object.assign(blankTurtle(), { id, sp: f.sp, sex: f.sex, grp: f.grp, zone: f.zone, src: "ซื้อมา", born: f.date, docType: f.docType, docNo: f.docNo });
    const item = { date: f.date, amount, note: f.note, docNo: f.docNo || "" };
    if (await save("apiBuyTurtle", [item, turtle], res => {
      local.turtles([turtle]);
      local.money({ id: res.id, date: f.date, direction: "จ่าย", category: "ซื้อเต่า", amount, turtleId: id, quantity: 1, total: amount, saleStatus: "", docNo: f.docNo, note: f.note });
    }, "บันทึกซื้อเต่าแล้ว")) {
      if (num(f.weight) > 0) {
        const entry = [{ id, g: num(f.weight), note: "น้ำหนักตอนซื้อ" }];
        await save("apiSaveWeights", [f.date, entry], () => local.weights(f.date, entry));
      }
      closeModal(); render();
    }
    return;
  }
  const isExpense = f.kind === "expense", category = String(f.category || "").trim();
  // ไม่เลือกหมวดให้ก่อน (กันลืมเปลี่ยนแล้วยอดไปรวมผิดหมวด) · ปุ่ม Food/Labor บน Home เลือกให้เอง
  if (!category) { alert(isExpense ? "เลือกหมวดรายจ่าย" : "ใส่ว่ารายรับจากอะไร"); return; }
  const linked = isExpense ? [...new Set(String(f.linked || "").split(/[,\s]+/).filter(Boolean))] : [];
  const missing = linked.filter(id => !idx().byId[id]);
  if (missing.length) { alert("ไม่พบรหัสเต่า: " + missing.join(", ")); return; }
  const item = { date: f.date, direction: isExpense ? "จ่าย" : "รับ", category, amount, turtleId: linked.join(","), lotId: "", quantity: 0, total: 0, saleStatus: "", docNo: "", note: f.note, defectQty: 0 };
  if (ed) { item.id = ed; done(await save("apiUpdateMoney", [item], () => local.moneyUpd(item), "แก้แล้ว")); return; }
  const delivery = isExpense && category === "ผัก" ? num(f.delivery) : 0;
  if (delivery > 0) {
    const items = [item, Object.assign({}, item, { category: "ค่าส่งผัก", amount: delivery, turtleId: "" })];
    done(await save("apiSaveMoneyBatch", [items], res => items.forEach((it, i) => local.money(Object.assign({}, it, { id: res.items[i].id }))), `บันทึกแล้ว · ผัก + ค่าส่ง ${baht(amount + delivery)}`));
    return;
  }
  done(await save("apiSaveMoney", [item], res => local.money(Object.assign({}, item, { id: res.id })), "บันทึกแล้ว"));
}
async function deleteMoney() {

    : x.category === "ซื้อเต่า" ? `\nเต่า ${x.turtleId} ยังอยู่ในทะเบียน (ถ้าเพิ่มผิด ลบได้ที่หน้าเต่า)`

}

function chart(h) {
  if (h.length < 2) return "";
  const W = 320, H = 120, P = { l: 46, r: 8, t: 8, b: 20 };
  const xs = h.map(w => parseISO(w.d).getTime()), ys = h.map(w => w.g);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  // แกนตั้งกว้างอย่างน้อย 20% ของน้ำหนัก: ตัวใหญ่ขึ้นลง 2-3% จะได้ไม่ดูเหมือนดิ่ง
  const mid = (y0 + y1) / 2, half = Math.max((y1 - y0) * 0.56, mid * 0.1, 1), lo = mid - half, hi = mid + half;
  const X = x => P.l + (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0)) * (W - P.l - P.r);
  const Y = y => P.t + (1 - (y - lo) / (hi - lo)) * (H - P.t - P.b);
  const pts = h.map(w => X(parseISO(w.d).getTime()).toFixed(1) + "," + Y(w.g).toFixed(1));
  const txt = (x, y, s, a) => `<text x="${x}" y="${y}" font-size="10" fill="#69736A" text-anchor="${a}">${s}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟน้ำหนัก">
    <line x1="${P.l}" x2="${W - P.r}" y1="${Y(y1)}" y2="${Y(y1)}" stroke="#E0E5DC"/><line x1="${P.l}" x2="${W - P.r}" y1="${Y(y0)}" y2="${Y(y0)}" stroke="#E0E5DC"/>
    ${txt(P.l - 6, Y(y1) + 3, fmtG(y1), "end")}${y1 !== y0 ? txt(P.l - 6, Y(y0) + 3, fmtG(y0), "end") : ""}
    ${txt(P.l, H - 4, thDate(h[0].d), "start")}${txt(W - P.r, H - 4, thDate(h[h.length - 1].d), "end")}

function parseIds(s) {
  const out = [];
  String(s).split(/[,\s]+/).filter(Boolean).forEach(part => {
    const m = part.match(/^(\d+)-(\d+)$/);
    if (!m) { out.push(part); return; }
    const a = +m[1], b = +m[2];
    if (b < a || b - a > 300) throw new Error("ช่วงรหัสไม่ถูกต้อง: " + part);
    for (let i = a; i <= b; i++) out.push(m[1].length > 1 && m[1][0] === "0" ? String(i).padStart(m[1].length, "0") : String(i));
  });
  return [...new Set(out)];
}
async function saveTurtleForm() {

function hatchLog(cid) {

  return `<div class="card" style="background:var(--bg)"><h3>+ Hatched ${hs.length} ครั้ง</h3>${hs.map(h => `<div class="row"><span class="grow">${thDate(h.d)} · ปกติ ${num(h.n)}${num(h.split) ? ` · <span class="amber">เบิ้ล ${num(h.split)}</span>` : ""}</span><span class="meta">${esc(h.lot ? moneyLotName(h.lot) : "")}</span></div>`).join("")}
    <div style="margin-top:6px"><button class="lnk" data-act="hatchUndo" data-id="${esc(cid)}" data-busy>ลบครั้งล่าสุด (กดผิด)</button></div></div>`;

async function undoHatch(cid) {
  const hs = S.hatch.filter(h => h.clutch === cid), h = hs[hs.length - 1], c = S.clutches.find(x => x.id === cid);
  if (!h || !c) return;
  const total = num(h.n) + num(h.split), lot = lotById(h.lot);
  if (lot && lotAvail(lot) < total) { alert(`กลุ่ม ${lotName(lot)} เหลือ ${lotAvail(lot)} ตัว หักคืน ${total} ตัวไม่ได้ (ขาย/ตายไปแล้ว)`); return; }
  if (!confirm(`ลบ + Hatched วันที่ ${thDate(h.d)} (ปกติ ${num(h.n)} · เบิ้ล ${num(h.split)})?\nชุด ${cid} และกลุ่ม${lot ? ` ${lotName(lot)}` : ""} จะลดลง ${total} ตัว`)) return;
  if (await save("apiUndoHatch", [cid], () => {
    S.hatch.splice(S.hatch.lastIndexOf(h), 1);
    const rest = S.hatch.filter(x => x.clutch === cid).map(x => x.d).sort();
    local.clutch(Object.assign(clone(c), { hatched: Math.max(0, num(c.hatched) - total) || "", split: Math.max(0, num(c.split) - num(h.split)), hatchD: rest[0] || "", hatchLast: rest[rest.length - 1] || "" }));
    if (lot) {
      const nl = Object.assign(clone(lot), { start: num(lot.start) - total, defect: Math.max(0, num(lot.defect) - num(h.split)) });
      if (!S.hatch.some(x => x.clutch === cid && x.lot === lot.id)) nl.clutches = String(nl.clutches || "").split(",").map(x => x.trim()).filter(x => x && x !== cid).join(",");
      local.lot(nl);
    }
  }, "ลบแล้ว")) { closeModal(); render(); openClutch(cid); }
}

async function closeClutch(id) {

// + Hatched: ลูกออกทยอย กดได้หลายวัน · แยกปกติ/เบิ้ล · เข้ากลุ่มเดิมหรือสร้างใหม่ (ลูกเต่าไม่ตั้งรหัส นับเป็นจำนวน)
function openHatch(id) {

async function saveHatch() {
  const f = S.form, c = S.clutches.find(x => x.id === f._hatch), total = f.n + f.split, isNew = f.lot === "new";
  if (!f.d) { alert("ใส่วันที่"); return; }
  if (!(total > 0)) { alert("กด + ใส่จำนวนที่ออก"); return; }
  if (num(c.hatched) + total > num(c.eggs)) { alert(`ออกรวม ${num(c.hatched) + total} ตัว มากกว่าจำนวนไข่ ${c.eggs} ฟอง`); return; }
  if (isNew && !f.zone) { alert("เลือกคอกของกลุ่มใหม่"); return; }
  const name = String(f.name || "").trim();
  const h = { clutch: c.id, d: f.d, n: f.n, split: f.split, lot: isNew ? "" : f.lot, newLot: isNew ? { sp: f.sp, zone: f.zone, name } : null };
  const r = await save("apiHatch", [h], res => {
    const nc = Object.assign(blankClutch(), clone(c), { hatched: num(c.hatched) + total, split: num(c.split) + f.split, hatchD: c.hatchD || f.d, hatchLast: f.d });
    local.clutch(nc);
    const lotId = res.lot || f.lot;
    let lot = S.lots.find(l => l.id === lotId);
    lot = lot ? clone(lot) : { id: lotId, sp: f.sp, hatchD: f.d, clutches: "", start: 0, zone: f.zone, note: "", dead: 0, split: 0, sold: 0, name: name || `${f.sp} ${f.zone}`, defect: 0, deadDefect: 0 };
    lot.start = num(lot.start) + total; lot.defect = num(lot.defect) + f.split; if (!lot.hatchD) lot.hatchD = f.d;
    const cl = String(lot.clutches || "").split(",").map(x => x.trim()).filter(Boolean);
    if (cl.indexOf(c.id) < 0) cl.push(c.id);
    lot.clutches = cl.join(",");
    local.lot(lot); local.hatch({ clutch: c.id, d: f.d, n: f.n, split: f.split, lot: lotId });
  }, `บันทึกแล้ว · ออก ${total} ตัว`);
  if (r) { closeModal(); render(); }
}

async function saveSettings() {
  const f = S.form, lists = {}, renames = {}, msgs = [];
  for (const kind of Object.keys(LISTS)) {
    const L = LISTS[kind], rows = f.lists[kind].map(r => Object.assign({}, r, { name: String(r.name).trim() })).filter(r => r.name), names = rows.map(r => r.name);
    if (!names.length) { alert(`ต้องมี${L.title}อย่างน้อย 1 รายการ`); return; }
    if (names.some(n => n.indexOf(",") >= 0)) { alert(`ชื่อ${L.title}ห้ามมีจุลภาค ( , )`); return; }
    const dup = names.filter((n, i) => names.indexOf(n) !== i);
    if (dup.length) { alert(`${L.title}ซ้ำ: ${[...new Set(dup)].join(", ")}`); return; }
    lists[kind] = rows;
    // แก้ชื่อแถวเดิมที่มีข้อมูลใช้อยู่ = เปลี่ยนชื่อในข้อมูลเก่าด้วย (หลังบ้านแก้ทีเดียวพร้อมตั้งค่า)
    const rn = rows.filter(r => r.old && r.name !== r.old && listCount(kind, r.old)).map(r => [r.old, r.name]);
    if (rn.length) renames[kind] = rn;
    rn.forEach(([a, b]) => msgs.push(`${L.title}: "${a}" → "${b}" (${listCount(kind, a)})`));
  }
  const zoneDays = {};
  lists.zones.forEach(r => { if (num(r.days) > 0) zoneDays[r.name] = num(r.days); });
  const obj = { species: lists.species.map(r => r.name).join(","), zones: lists.zones.map(r => r.name).join(","), moneyCats: lists.moneyCats.map(r => r.name).join(","), zoneDays: JSON.stringify(zoneDays),
    dropS: num(f.dropS), dropM: num(f.dropM), dropPct: num(f.dropPct), staleKid: num(f.staleKid), staleBig: num(f.staleBig), eggGap: num(f.eggGap), eggAhead: num(f.eggAhead) };
  if (!["dropS", "dropM", "dropPct", "staleKid", "staleBig", "eggGap", "eggAhead"].every(k => obj[k] > 0)) { alert("เกณฑ์ต้องเป็นตัวเลขมากกว่า 0"); return; }
  if (msgs.length && !confirm("เปลี่ยนชื่อ (ข้อมูลเก่าเปลี่ยนตามด้วย)\n\n" + msgs.join("\n") + "\n\nตกลงไหม")) return;
  if (await save("apiSaveSettings", [obj, renames], () => { local.renameValues(renames); S.set = normSet(obj); changed(); }, "บันทึกแล้ว")) {
    (renames.zones || []).forEach(([a, b]) => { if (S.zone === a) S.zone = b; });
    (renames.species || []).forEach(([a, b]) => { if (S.sp === a) S.sp = b; });
    closeModal(); render();
  }
}

  goZoneWeigh: b => { S.tab = "weigh"; S.zone = b.dataset.z || "ทั้งหมด"; lsSet(LS.tab, S.tab); render(); window.scrollTo(0, 0); },
  tasksOpen: openTasks,
  wSave: saveWeights,
  wClear: () => { if (confirm("ล้างตัวเลขที่ยังไม่บันทึกทั้งหมด?")) { S.draft = null; S.noteOpen = {}; lsSet(LS.draft, null); render(); } },
  turtle: b => openTurtle(b.dataset.id),
  wEdit: b => openWeightEdit(b.dataset.id, b.dataset.d),
  wEditSave: () => saveWeightEdit(false),
  wEditDel: () => saveWeightEdit(true),
  tAdd: () => openTurtleForm(null),
  tEdit: b => openTurtleForm(b.dataset.id),
  tSave: saveTurtleForm,
  tDel: deleteTurtle,
  unit: b => {
    const t = idx().byId[b.dataset.id];
    if (!t) return;
    S.unit[t.id] = unitOf(t) === "kg" ? "g" : "kg";
    render();
  },
  fset: b => {
    S.form[b.dataset.k] = b.dataset.v;
    if (S.form._hatch) renderHatch();
    else if (S.form._fert) renderFertile();
    else if (S.form._split) renderLotSplit();
    else if (S.form._move) renderLotMove();
    else if (S.form._lotNew !== undefined) renderLot();
    else if (S.form.kind) renderMoneyForm();
    else if ("dueDate" in S.form) { if (b.dataset.k === "repeatDays") S.form._repCustom = ""; renderTask(); }
    else if ("eggs" in S.form) renderClutch();
    else if (b.dataset.k === "status" || b.dataset.k === "sDate") renderStatus();
    else if (S.form._sym) { const el = document.querySelector('[data-f="d"]'); if (el) el.value = S.form.d; document.querySelectorAll('[data-k="d"]').forEach(x => x.setAttribute("aria-pressed", x.dataset.v === S.form.d)); }
    else if (S.form.amounts) { const el = document.querySelector('[data-f="date"]'); if (el) el.value = S.form.date; document.querySelectorAll('[data-k="date"]').forEach(x => x.setAttribute("aria-pressed", x.dataset.v === S.form.date)); }
    else renderTurtleForm();
  },
  status: b => openStatus(b.dataset.id),
  stSave: () => saveStatus(null),
  revive: b => saveStatus(b.dataset.id),
  st: b => { S.st = b.dataset.v; S.sp = "ทั้งหมด"; render(); },
  sp: b => { S.sp = b.dataset.v; render(); },
  eggYear: b => { S.eggYear = b.dataset.v; render(); },
  turtleView: b => { S.turtleView = b.dataset.v; render(); },
  cAdd: () => openClutch(null),
  cOpen: b => openClutch(b.dataset.id),
  cSave: saveClutch,
  cDel: deleteClutch,
  cFert: b => openFertile(b.dataset.id),
  cFertSave: saveFertile,
  cClose: b => closeClutch(b.dataset.id),
  byMother: openByMother,
  hatch: b => openHatch(b.dataset.id),
  hatchStep: b => { const k = b.dataset.k; S.form[k] = Math.max(0, num(S.form[k]) + Number(b.dataset.v)); renderHatch(); },
  hatchSave: saveHatch,
  lotSell: b => openMoney("sale", { target: "lot", lotId: b.dataset.id }),
  goTurtleWeigh: b => { S.tab = "weigh"; S.zone = idx().byId[b.dataset.id].zone || "ทั้งหมด"; lsSet(LS.tab, S.tab); render(); },
  moneyOpen: b => openMoney(b.dataset.kind, b.dataset.cat ? { category: b.dataset.cat } : null),
  moneySave: saveMoneyForm,
  saleComplete: b => openCompleteSale(b.dataset.id),
  saleCompleteSave: saveCompleteSale,
  recurringExpense: openRecurringExpenses,
  recurringSave: saveRecurringExpenses,
  lotAdd: () => openLot(null),
  lotOpen: b => openLot(b.dataset.id),
  lotSave: saveLotForm,
  lotDeath: b => openLotChange(b.dataset.id, "death"),
  lotDeathSave: saveLotDeath,
  lotSplit: b => openLotChange(b.dataset.id, "split"),
  lotSplitSave: saveLotSplit,
  lotDelete: async b => {
    const l = S.lots.find(x => x.id === b.dataset.id);
    if (!l) return;
    if (num(l.start) !== num(l.dead) + num(l.split) + lotSold(l.id) || lotReserved(l.id)) { alert("ลบไม่ได้เพราะกลุ่มยังมีตัวเหลือหรือมีมัดจำค้าง"); return; }
    if (S.money.some(x => x.lotId === l.id) || S.turtles.some(t => t.lot === l.id)) { alert("ลบกลุ่มไม่ได้เพราะมีประวัติซื้อขายหรือเต่าที่แยกจากกลุ่มแล้ว"); return; }
    if (!confirm(`ลบกลุ่ม ${l.id}?`)) return;
    if (await save("apiDeleteLot", [l.id], () => local.delLot(l.id), "ลบกลุ่มแล้ว")) { closeModal(); render(); }
  },
  taskAdd: () => openTask(null),
  taskTemplate: b => openTask(null, b.dataset.v),
  taskEdit: b => openTask(b.dataset.id),
  taskSave: saveTask,
  taskDone: b => { const inModal = !!b.closest("#modal"); completeTask(b.dataset.id).then(() => { if (inModal && !$("#modal").hidden) openTasks(); }); },
  taskDelete: async b => {
    if (!confirm("ลบงานนี้?")) return;
    if (await save("apiDeleteTask", [b.dataset.id], () => local.delTask(b.dataset.id), "ลบงานแล้ว")) { closeModal(); render(); }
  },
  setSave: saveSettings,
  listAdd: b => { const k = b.dataset.k, r = S.form.lists[k]; r.push({ old: "", name: "", days: 0 }); redrawList(k, r.length - 1); },
  listUp: b => { const k = b.dataset.k, i = Number(b.dataset.i), r = S.form.lists[k]; if (i > 0) { [r[i - 1], r[i]] = [r[i], r[i - 1]]; redrawList(k); } },
  listDel: b => {
    const k = b.dataset.k, i = Number(b.dataset.i), r = S.form.lists[k][i], c = listCount(k, r.old, k !== "moneyCats");
    if (c && !confirm(`"${r.old}" ยังมี ${c}\n\nลบชื่อออกจากรายการแล้ว ข้อมูลเดิมยังใช้ชื่อนี้อยู่${k === "zones" ? " (ย้ายได้ที่ แก้ข้อมูลเต่า หรือ Move ของกลุ่ม)" : ""} ลบไหม`)) return;
    S.form.lists[k].splice(i, 1); redrawList(k);
  },
  zoneCycle: b => { S.form.lists.zones[Number(b.dataset.i)].days = Number(b.dataset.v); redrawList("zones"); },
  listNew: b => addListItem(b.dataset.kind, b.dataset.k),
  forgetPin: () => { if (confirm("ล้างรหัสที่เครื่องนี้จำไว้?")) { lsSet(LS.pin, null); S.pin = ""; closeModal(); S.needPin = true; render(); } },
  pinGo: () => { S.pin = $("#pinInput").value.trim(); lsSet(LS.pin, S.pin); S.pinTried = true; S.needPin = false; render(); load(); },
};
document.addEventListener("click", e => {
  if (e.target.id === "modal") { closeModal(); return; }
  // ช่องวันที่โปร่งใสหน้า Weight: เบราว์เซอร์คอมพ์ต้องสั่งเปิดปฏิทินเอง (iPhone เปิดเองอยู่แล้ว)
  if (e.target.id === "wDate" && e.target.showPicker) { try { e.target.showPicker(); } catch (err) { /* บางเบราว์เซอร์ไม่ให้ */ } }
  const b = e.target.closest("[data-act]");
  if (b && ACT[b.dataset.act] && !b.disabled) ACT[b.dataset.act](b, e);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.w !== undefined) onWeightInput(el);
  else if (el.dataset.i !== undefined) onInchInput(el);
  else if (el.dataset.n !== undefined) { ensureDraft().n[el.dataset.n] = el.value; touchDraft(); }
  else if (el.dataset.li && S.form && S.form.lists) { const [k, i] = el.dataset.li.split(":"); S.form.lists[k][Number(i)].name = el.value; }
  else if (el.dataset.f && S.form) {
    S.form[el.dataset.f] = el.value;
    if (el.dataset.f === "mom" && $("#momHint")) { const t = idx().byId[el.value.trim()]; $("#momHint").textContent = t ? t.sp : el.value.trim() ? "ไม่พบในทะเบียน" : ""; }
    // ขายจากกลุ่ม: จำนวน × ราคา/ตัว = รวม (คิดให้ทันทีที่พิมพ์)
    if (S.form.kind === "sale" && /^(n|dq|price)$/.test(el.dataset.f)) {
      const q = Math.max(0, Math.round(num(S.form.n))) + Math.max(0, Math.round(num(S.form.dq)));
      if (num(S.form.price) > 0 && q) { S.form.total = String(Math.round(q * num(S.form.price) * 100) / 100); const t = document.querySelector('[data-f="total"]'); if (t) t.value = S.form.total; }
      const c = $("#saleCalc"); if (c) c.textContent = saleCalcText();
    }
  } else if (el.dataset.hn && S.form && S.form._hatch) {
    S.form[el.dataset.hn] = Math.max(0, Math.round(num(el.value)));
    const h = $("#hatchHint"); if (h) h.innerHTML = hatchHintText();
  } else if (el.id === "q") { S.q = el.value; $("#tlist").innerHTML = tList(); }
  else if (el.dataset.batch !== undefined && S.form && S.form.amounts) S.form.amounts[Number(el.dataset.batch)] = el.value;
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.f && S.form) {
    S.form[el.dataset.f] = el.value;
    if (el.dataset.live === "money") renderMoneyForm();
    if (el.dataset.live === "hatch") renderHatch();
    if (el.dataset.live === "task") renderTask();
    if (el.dataset.f === "saleStatus" && S.form.kind === "sale" && S.form.saleStatus === "paid") S.form.amount = S.form.total;
    if (el.dataset.f === "category" && S.form.recurring) {
      S.form.amount = String(previousCategoryTotal(S.form.category) || "");
      const amount = document.querySelector('[data-f="amount"]');
      if (amount) amount.value = S.form.amount;
    }
  }
  if (el.id === "wDate") {
    const n = new Set(pending().map(x => x.id).concat(watchPending())).size;
    if (n && !confirm(`มีน้ำหนักที่ยังไม่บันทึก ${n} ตัว เปลี่ยนวันแล้วตัวเลขชุดนี้จะหาย ตกลงไหม`)) { el.value = S.wDate; return; }
    S.wDate = el.value || todayISO(); S.draft = null; S.noteOpen = {}; lsSet(LS.draft, null); render();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").hidden) { closeModal(); return; }
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("win")) {
    e.preventDefault();
    const all = [...document.querySelectorAll(".win")], i = all.indexOf(e.target);
    if (all[i + 1]) { all[i + 1].focus(); all[i + 1].select(); } else e.target.blur();
  }
  if (e.key === "Enter" && e.target.id === "pinInput") ACT.pinGo();
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkRev(); });
window.addEventListener("beforeunload", e => { if (pending().length) { e.preventDefault(); e.returnValue = ""; } });

let toastT = null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200);
}

/* ================= โหมดตัวอย่าง (เปิดไฟล์ในเครื่อง / ยังไม่ได้ตั้ง TURTLE_API) ================= */
function demoData() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const today = todayISO(), back = n => { const d = parseISO(today); d.setDate(d.getDate() - n); return iso(d); };
  const turtles = [], weights = [];
  const T = (id, sp, sex, grp, zone, extra) => turtles.push(Object.assign({ id: String(id), sp, sex, grp, zone, src: "ซื้อมา", clutch: "", born: back(900), status: ALIVE, sDate: "", sNote: "", note: "", watch: "", wNote: "", weighMode: "" }, extra || {}));
  [["Leopard", 1, 8, 11000, "คอกเสือดาว"], ["Sulcata", 9, 14, 32000, "คอกซูคาต้า"], ["Indian Star", 15, 18, 1900, "คอกสตาร์"], ["Burmese Star", 19, 21, 3200, "คอกสตาร์"], ["Aldabra", 22, 23, 75000, "คอกอัลดาบร้า"]]
    .forEach(([sp, a, b, base, zone]) => {
      for (let id = a; id <= b; id++) {
        // พ่อแม่พันธุ์ซูคาต้าหนักเกินตาชั่ง = ตั้งชั่งปีละครั้ง (เหมือนของจริง)
        T(id, sp, id % 3 === 0 ? "ผู้" : "เมีย", "พ่อแม่พันธุ์", zone, sp === "Sulcata" && id <= 12 ? { weighMode: "yearly" } : null);
        let g = base * (0.8 + rnd() * 0.4);
        const lastGap = id === 22 || id === 23 ? 26 : 9;
        for (let d = lastGap + 7 * 14; d >= lastGap; d -= 14) {
          g *= 1 + (rnd() - 0.42) * 0.02;
          if (id === 3 && d <= lastGap + 14) g *= 0.94;
          if (id === 5 && d <= lastGap + 14) g *= 0.965;
          weights.push({ d: back(d), id: String(id), g: Math.round(g), note: id === 3 && d === lastGap ? "ไม่ค่อยกิน มีน้ำมูกใส" : "" });
        }
      }
    });
  T(24, "Albino Sulcata", "ไม่ทราบ", "ตัวกลาง", "คอกซูคาต้า"); T(25, "Albino Sulcata", "ไม่ทราบ", "ตัวกลาง", "คอกซูคาต้า");
  ["24", "25"].forEach((id, k) => { let g = 1400 + k * 200; for (let d = 98; d >= 9; d -= 14) { g += 35 + rnd() * 25; weights.push({ d: back(d), id, g: Math.round(g), note: "" }); } });
  Object.assign(turtles.find(t => t.id === "7"), { status: DEAD, sDate: back(20), sNote: "มูกปาก/จมูก" });
  for (let i = weights.length - 1; i >= 0; i--) if (weights[i].id === "7" && weights[i].d > back(20)) weights.splice(i, 1);
  Object.assign(turtles.find(t => t.id === "12"), { watch: back(3), wNote: "น้ำมูกใส หายใจมีเสียง" });
  weights.push({ d: back(3), id: "12", g: "", note: "เริ่มเฝ้าดู: น้ำมูกใส หายใจมีเสียง" });
  const clutches = [
    { id: "C001", mom: "2", dad: "3", laid: back(170), eggs: 8, fertile: 7, hatchD: back(70), hatched: 6, note: "", fertD: back(150), split: 0, hatchLast: back(62), closed: back(50) },
    { id: "C002", mom: "10", dad: "9", laid: back(150), eggs: 18, fertile: 15, hatchD: back(66), hatched: 14, note: "", fertD: back(130), split: 2, hatchLast: back(52), closed: back(40) },
    // C005 กำลังออกทยอย → ปุ่ม + Hatched เข้ากลุ่ม Sulcata อนุบาล
    { id: "C005", mom: "11", dad: "9", laid: back(110), eggs: 28, fertile: 19, hatchD: back(14), hatched: 11, note: "", fertD: back(92), split: 2, hatchLast: back(2), closed: "" },
    { id: "C003", mom: "4", dad: "", laid: back(21), eggs: 7, fertile: "", hatchD: "", hatched: "", note: "ตู้ฟัก 1", fertD: "", split: 0, hatchLast: "", closed: "" },
    { id: "C004", mom: "16", dad: "15", laid: back(33), eggs: 3, fertile: 2, hatchD: "", hatched: "", note: "", fertD: back(14), split: 0, hatchLast: "", closed: "" },
    // ปีก่อน แม่ 17 วางครั้งแรกวันนี้+4 → Home เตือน "Egg season อีก 4 วัน"
    { id: "C000", mom: "17", dad: "", laid: back(361), eggs: 4, fertile: 2, hatchD: back(240), hatched: 2, note: "", fertD: back(340), split: 0, hatchLast: back(238), closed: back(230) },
  ];
  const lots = [
    { id: "G001", sp: "Sulcata", hatchD: back(66), clutches: "C002,C005", start: 25, zone: "บ้าน", note: "", dead: 1, split: 2, sold: 0, name: "Sulcata อนุบาล 1", defect: 4, deadDefect: 1, splitDefect: 0 },
  ];
  const hatch = [
    { clutch: "C002", d: back(66), n: 9, split: 1, lot: "G001" }, { clutch: "C002", d: back(52), n: 3, split: 1, lot: "G001" },
    { clutch: "C005", d: back(14), n: 5, split: 1, lot: "G001" }, { clutch: "C005", d: back(2), n: 4, split: 1, lot: "G001" },
  ];
  const money = [
    { id: "M00001", date: back(4), direction: "จ่าย", category: "ค่าแรงประจำ", amount: 4000, turtleId: "", lotId: "", quantity: 0, total: 0 },
    { id: "M00002", date: back(3), direction: "จ่าย", category: "ผัก", amount: 1450, turtleId: "", lotId: "", quantity: 0, total: 0 },
    { id: "M00004", date: back(3), direction: "จ่าย", category: "ค่าส่งผัก", amount: 150, turtleId: "", lotId: "", quantity: 0, total: 0 },
    { id: "M00003", date: back(2), direction: "รับ", category: "ขายเต่า", amount: 200, turtleId: "", lotId: "G001", quantity: 1, total: 200, saleStatus: "paid", defectQty: 0 },
  ];
  const tasks = [
    { id: "T00001", title: "เปลี่ยนหลอด UVB", dueDate: back(2), repeatDays: 182, note: "คอกลูกเต่า", done: false },
    { id: "T00002", title: "เก็บไข่", dueDate: back(-3), repeatDays: 0, note: "", done: false },
    { id: "T00003", title: "ถ่ายพยาธิ", dueDate: back(-40), repeatDays: 365, note: "ทุกคอก", done: false },
  ];
  for (let id = 101; id <= 112; id++) {
    const leo = id <= 106, cl = leo ? clutches[0] : clutches[1];
    T(id, leo ? "Leopard" : "Sulcata", "ไม่ทราบ", "ลูกเต่า", "บ้าน", { src: "ฟักเอง", clutch: cl.id, born: cl.hatchD });
    let g = leo ? 38 + rnd() * 8 : 32 + rnd() * 6;
    for (let d = 60; d >= 1; d -= 5) {
      const stuck = id === 105 && d <= 16;
      g += stuck ? -0.5 : (leo ? 0.9 : 1.6) * 5 * (0.7 + rnd() * 0.6);
      weights.push({ d: back(d), id: String(id), g: Math.round(g * 10) / 10, note: "" });
    }
  }
  return { turtles, weights, clutches, lots, money, tasks, hatch, settings: { species: DEF.species.join(","), zones: "บ้าน,คอกเสือดาว,คอกซูคาต้า,คอกสตาร์,คอกอัลดาบร้า", dropPct: 5, staleKid: 10, staleBig: 21, eggGap: 21, eggAhead: 14 }, rev: 1, sheetUrl: "" };
}

/* ================= เริ่มแอป ================= */
(function boot() {
  const m = location.hash.match(/[#&]k=([^&]+)/);
  if (m) { lsSet(LS.pin, decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname + location.search); }
  if (typeof google !== "undefined" && google.script && google.script.run) S.mode = "gas";
  else if (API_URL) S.mode = "api";
  S.pin = lsGet(LS.pin, "");
  if (S.mode === "demo") DEMO = demoData();
  else {
    const dr = lsGet(LS.draft, null);
    if (dr && dr.date) { S.draft = dr; S.wDate = dr.date; }
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => null);
  }
  render();
  load();
})();
